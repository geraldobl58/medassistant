name: medassistant

services:
  medassistant-db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5732:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: medassistantdb
    volumes:
      - medassistant-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-medassistantdb}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
volumes:
  medassistant-db-data:
